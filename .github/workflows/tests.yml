name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

# A newer push to the same pull request makes the run in flight stale. Runs on
# the branches themselves are left to finish, so every merge keeps a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite, and only the suite. Static analysis lives in the linter
  # workflow, which runs it once rather than once per PHP version, and which
  # cannot stop these tests from running by failing first.
  ci:
    runs-on: ubuntu-latest
    strategy:
      # One version failing is not a reason to stop learning about the other.
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No coverage is collected, and Xdebug loaded for nothing slows every
      # request the suite makes.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # The Blade root view resolves the Vite manifest, so every page test
      # needs the built assets.
      - name: Build Assets
        run: npm run build

      - name: Tests
        run: php artisan test

  # vitest.config.ts leaves out the Vite plugins that shell out to artisan,
  # but the components under test still import the generated route helpers
  # (`@/routes`), which are gitignored. PHP is here to generate those and
  # nothing else — no asset build.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The flag matches `formVariants` in vite.config.ts.
      - name: Generate Route Helpers
        run: php artisan wayfinder:generate --with-form

      - name: Frontend Tests
        run: npm run test

  # The suite runs on SQLite, and the application runs on MySQL. That is
  # normally a fair trade, but not for the code that exists *because* the two
  # differ: RebuildRollups::latestCompletion() branches on the driver because a
  # null `max()` over a `timestamp` materialises as the zero date on MySQL, and
  # NO_ZERO_DATE then rejects the row and fails the whole rebuild. The SQLite
  # half is covered; the half that guards a production failure was never once
  # executed. One job, on one PHP version, so that it is.
  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: droneverse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # The Blade root view resolves the Vite manifest, so every page test
      # needs the built assets whichever database is behind it.
      - name: Build Assets
        run: npm run build

      # phpunit.xml pins the connection, so the connection is what gets
      # rewritten — not the process environment. PHPUnit does treat a real
      # environment variable as taking precedence over an unforced `<env>`
      # entry, but a MySQL job that quietly ran on SQLite would burn CI
      # minutes and prove nothing, so the two `grep`s make the rewrite itself
      # the thing that fails if it ever stops matching.
      - name: Point the suite at MySQL
        run: |
          sed -i 's|<env name="DB_CONNECTION" value="sqlite"/>|<env name="DB_CONNECTION" value="mysql"/>|' phpunit.xml
          sed -i 's|<env name="DB_DATABASE" value=":memory:"/>|<env name="DB_DATABASE" value="droneverse_test"/>|' phpunit.xml
          grep -q '<env name="DB_CONNECTION" value="mysql"/>' phpunit.xml
          grep -q '<env name="DB_DATABASE" value="droneverse_test"/>' phpunit.xml

      # Host, port and credentials are not in phpunit.xml at all, so they come
      # from .env — where .env.example leaves them commented out.
      - name: Point .env at the service container
        run: |
          {
            echo 'DB_HOST=127.0.0.1'
            echo 'DB_PORT=3306'
            echo 'DB_USERNAME=root'
            echo 'DB_PASSWORD=root'
          } >> .env

      - name: Tests
        run: php artisan test
