name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

# Read-only: this workflow reports on the code, it no longer rewrites it.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # The check-only variants, deliberately. Every step here used to run the
      # writing one — `pint --parallel`, `prettier --write`, `eslint --fix` —
      # which rewrites the checkout and exits 0, and the auto-commit step that
      # would have published those rewrites was commented out. The job could
      # not fail, so nothing it covers was ever actually enforced.
      - name: Run Pint
        run: composer lint:check

      # rector.php has been in the repo all along, configured against ten
      # Laravel sets and six prepared ones, and nothing ever ran it but a
      # developer who thought to. Three violations reached main that way.
      #
      # `--dry-run` exits non-zero on a pending change, so this reports
      # rather than rewrites, like everything else here.
      #
      # Fixing locally is `composer rector` then `composer lint`, in that
      # order: the two disagree about arrow functions — Rector emits `fn(`
      # and Pint wants `fn (` — so Rector last leaves the checkout failing
      # the step above.
      - name: Run Rector
        run: composer rector:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
