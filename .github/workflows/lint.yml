name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

# Read-only: this workflow reports on the code, it no longer rewrites it.
permissions:
  contents: read

# A newer push to the same pull request makes the run in flight stale. Runs on
# the branches themselves are left to finish, so every merge keeps a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check that reads the code without running it, once, on the PHP the
  # application runs on. PHPStan and tsc used to sit at the head of the test
  # matrix instead, where a type error stopped the job before the suite ran —
  # so from the first red analysis on main, CI reported on no tests at all.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The check-only variants, deliberately. Every step here used to run the
      # writing one — `pint --parallel`, `prettier --write`, `eslint --fix` —
      # which rewrites the checkout and exits 0, and the auto-commit step that
      # would have published those rewrites was commented out. The job could
      # not fail, so nothing it covers was ever actually enforced.
      - name: Run Pint
        run: composer lint:check

      # `--dry-run` exits non-zero on a pending change, so this reports
      # rather than rewrites, like everything else here.
      #
      # Fixing locally is `composer rector` then `composer lint`, in that
      # order: the two disagree about arrow functions — Rector emits `fn(`
      # and Pint wants `fn (` — so Rector last leaves the checkout failing
      # the step above.
      - name: Run Rector
        run: composer rector:check

      - name: Run PHPStan
        run: composer types:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check

      # The route helpers under resources/js/{actions,routes,wayfinder} are
      # generated and gitignored, and tsc cannot check the pages that import
      # them until they exist. The flag matches `formVariants` in
      # vite.config.ts, so the types checked are the types the build emits.
      - name: Generate Route Helpers
        run: php artisan wayfinder:generate --with-form

      - name: Check Frontend Types
        run: npm run types:check

      # Advisories are published against versions already in the lock file, so
      # this fails on a morning when nothing in the diff changed. That is the
      # point: it is the only step here that reports on code nobody touched.
      # The npm threshold sits at high because monaco-editor pins a dompurify
      # range with an open moderate advisory and no non-breaking fix.
      - name: Audit Dependencies
        run: composer audit:check
