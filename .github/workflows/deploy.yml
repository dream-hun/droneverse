# Zero-downtime deploy to a VPS over SSH.
#
# Server layout (created automatically on first deploy):
#   $DEPLOY_PATH/releases/<timestamp>-<sha>   one directory per deploy
#   $DEPLOY_PATH/shared/.env                  created by you, once (see below)
#   $DEPLOY_PATH/shared/storage               persistent storage/
#   $DEPLOY_PATH/current                      symlink served by nginx/php-fpm
#
# Required repository secrets:
#   DEPLOY_HOST      server hostname or IP
#   DEPLOY_USER      SSH user that owns $DEPLOY_PATH (needs php 8.4 in PATH)
#   DEPLOY_SSH_KEY   private key for that user (ed25519 recommended)
# Optional:
#   DEPLOY_PORT      SSH port (default 22)
#   DEPLOY_PATH      app directory (default /var/www/droneverse)
#
# One-time server prep:
#   mkdir -p /var/www/droneverse/shared
#   cp .env.example /var/www/droneverse/shared/.env   # then fill in real values
#   point nginx at /var/www/droneverse/current/public
#
# The web assets and composer dependencies are built on the runner, so the
# server needs neither node nor composer — only php-fpm and the php cli.

name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: php artisan test

      - name: Strip Dev Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Create Release Artifact
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./storage' \
            --exclude='./.env' \
            --exclude='./database/database.sqlite' \
            .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/droneverse-release.tar.gz"

      - name: Activate Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/droneverse' }}
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$RELEASE" <<'REMOTE_SCRIPT'
          set -euo pipefail

          base="$1"
          release="$base/releases/$2"

          mkdir -p "$base/releases" \
            "$base/shared/storage/app/public" \
            "$base/shared/storage/framework/cache/data" \
            "$base/shared/storage/framework/sessions" \
            "$base/shared/storage/framework/views" \
            "$base/shared/storage/logs"

          if [ ! -f "$base/shared/.env" ]; then
            echo "ERROR: $base/shared/.env does not exist." >&2
            echo "Create it from .env.example with production values, then re-run." >&2
            exit 1
          fi

          mkdir -p "$release"
          tar -xzf /tmp/droneverse-release.tar.gz -C "$release"
          rm -f /tmp/droneverse-release.tar.gz

          ln -sfn "$base/shared/.env" "$release/.env"
          ln -sfn "$base/shared/storage" "$release/storage"

          cd "$release"
          php artisan migrate --force
          php artisan optimize

          ln -sfn "$release" "$base/current"
          php artisan queue:restart

          cd "$base/releases"
          ls -1 | sort -r | tail -n +6 | xargs -r rm -rf

          echo "Deployed release $2"
          REMOTE_SCRIPT
